<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Themen-Voting: Was wäre wenn?</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #060911;
            color: #ffffff;
            padding: 3rem 1.5rem;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 980px;
            width: 100%;
        }

        .header-section {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .header-section h1 {
            font-size: 1.85rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
        }

        .header-section p {
            color: #5497ff;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.25rem;
            margin-bottom: 2rem;
        }

        @media (max-width: 820px) {
            .cards-grid {
                grid-template-columns: 1fr;
            }
        }

        .voting-card {
            background-color: #0d1424;
            border: 1px solid #1a273f;
            border-radius: 16px;
            padding: 1.35rem 1.4rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 240px;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .voting-card:hover:not(.locked) {
            border-color: #3b82f6;
            background-color: #10192e;
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
        }

        .voting-card.selected {
            border-color: #3b82f6;
            background-color: #121e38;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.6);
        }

        .voting-card.locked:not(.selected) {
            opacity: 0.45;
            cursor: not-allowed;
            filter: grayscale(15%);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .icon-box {
            width: 46px;
            height: 46px;
            background-color: #141f33;
            border: 1px solid #1c2c48;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.45rem;
        }

        .badge {
            background-color: #131d31;
            color: #94a3b8;
            border: 1px solid #1e2e4d;
            font-size: 0.76rem;
            font-weight: 600;
            padding: 0.35rem 0.85rem;
            border-radius: 9999px;
            letter-spacing: 0.02em;
        }

        .card-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: #f8fafc;
            margin-bottom: 0.35rem;
            line-height: 1.3;
        }

        .card-hook {
            color: #5497ff;
            font-size: 0.86rem;
            font-weight: 500;
            margin-bottom: 0.65rem;
            line-height: 1.4;
        }

        .card-desc {
            color: #8b9bb4;
            font-size: 0.86rem;
            line-height: 1.45;
            margin-bottom: 1.25rem;
        }

        .card-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 0.85rem;
            border-top: 1px solid #162238;
        }

        .action-label {
            color: #5c6f8c;
            font-size: 0.82rem;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .voting-card:hover:not(.locked) .action-label {
            color: #93c5fd;
        }

        .voting-card.selected .action-label {
            color: #38bdf8;
            font-weight: 700;
        }

        .count-pill {
            background-color: #101a2c;
            border: 1px solid #1d2c47;
            color: #e2e8f0;
            font-size: 0.82rem;
            font-weight: 600;
            padding: 0.3rem 0.75rem;
            border-radius: 8px;
        }

        /* Summary Standings Box */
        .summary-card {
            background-color: #0d1424;
            border: 1px solid #1a273f;
            border-radius: 16px;
            padding: 1.5rem 1.6rem;
        }

        .summary-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.4rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .summary-title-group h2 {
            font-size: 1.25rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 0.25rem;
        }

        .summary-title-group p {
            font-size: 0.88rem;
            color: #64748b;
        }

        .summary-title-group p span {
            color: #5497ff;
            font-weight: 700;
        }

        .summary-btns {
            display: flex;
            gap: 0.6rem;
        }

        .btn {
            background-color: #131d31;
            color: #94a3b8;
            border: 1px solid #1f2e4d;
            padding: 0.45rem 0.95rem;
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background-color: #1a2742;
            color: #ffffff;
            border-color: #2b3d63;
        }

        .results-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .result-item {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .result-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.88rem;
        }

        .result-label {
            display: flex;
            align-items: center;
            gap: 0.55rem;
            color: #e2e8f0;
            font-weight: 500;
        }

        .result-stats {
            color: #8b9bb4;
            font-size: 0.86rem;
        }

        .progress-track {
            background-color: #080c16;
            height: 7px;
            border-radius: 9999px;
            overflow: hidden;
        }

        .progress-bar {
            background: linear-gradient(90deg, #2563eb, #3b82f6);
            height: 100%;
            width: 0%;
            border-radius: 9999px;
            transition: width 0.35s ease-out;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-section">
        <h1>Was wäre, wenn...?</h1>
        <p>Klicke auf eine Karte, um deine Stimme abzugeben.</p>
    </div>

    <div class="cards-grid" id="cardsGrid"></div>

    <div class="summary-card">
        <div class="summary-header">
            <div class="summary-title-group">
                <h2>Aktueller Zwischenstand</h2>
                <p>Insgesamt abgegebene Stimmen: <span id="totalVotes">0</span></p>
            </div>
            <div class="summary-btns">
                <button type="button" class="btn" id="resetBtn">Zurücksetzen</button>
                <button type="button" class="btn" onclick="window.print()">🖨️ Drucken / PDF</button>
            </div>
        </div>
        <div class="results-container" id="resultsContainer"></div>
    </div>
</div>

<script>
    const topics = [
        {
            id: 0,
            icon: "🛗",
            cat: "Kosmos & Physik",
            title: "Fahrstuhl ins All",
            hook: "„Bei normaler Geschwindigkeit dauert die Fahrt tagelang.“",
            desc: "Was isst du unterwegs, wann wird der Himmel pechschwarz und ab welcher Höhe schwebst du schwerelos in der Kabine?"
        },
        {
            id: 1,
            icon: "🐜",
            cat: "Biologie & Natur",
            title: "Alle Ameisen auf einer Waage",
            hook: "„Ameisen wiegen zusammen fast so viel wie die gesamte Menschheit.“",
            desc: "Wie sähe der astronomische Berg aus Biomasse aus und was bedeutet dieser Vergleich für das irdische Ökosystem?"
        },
        {
            id: 2,
            icon: "⚡",
            cat: "Physik & Relativität",
            title: "Lichtgeschwindigkeit bei 100 km/h",
            hook: "„Du siehst die Welt mit extremer Zeitverzögerung.“",
            desc: "Das Sonnenlicht bräuchte Stunden zu uns, Anrufe wären unmöglich und ein Spaziergang würde zur visuellen Zeitreise."
        },
        {
            id: 3,
            icon: "🌕",
            cat: "Astronomie & Schwerkraft",
            title: "Der Mond 100 km über deiner Stadt",
            hook: "„Er füllt das gesamte Sichtfeld aus und ist zum Greifen nah.“",
            desc: "Gigantische Gezeitenkräften, Gravitationschaos und die Frage: Könnte man ihn mit einer Rakete sofort berühren?"
        },
        {
            id: 4,
            icon: "🌱",
            cat: "Mensch & Biochemie",
            title: "Menschen mit Photosynthese",
            hook: "„Nie wieder kochen – einfach in die Sonne legen?“",
            desc: "Wie viel Quadratmeter Hautoberfläche müsstest du freilegen, um deinen täglichen Kalorienbedarf wirklich zu decken?"
        },
        {
            id: 5,
            icon: "🥤",
            cat: "Klima & Experiment",
            title: "Die Ozeane bestehen aus Cola",
            hook: "„Klingt harmlos und süß, ist aber eine globale Katastrophe.“",
            desc: "Zuckergehalt, Säureätzung, CO2-Entgasung und gigantische Schlammstrände zerstören Küsten und das Erdklima."
        },
        {
            id: 6,
            icon: "🧠",
            cat: "Gehirn & Psychologie",
            title: "Jede Sekunde bewusst erleben",
            hook: "„Kein Autopilot, kein 'Zeit verfliegen lassen' mehr.“",
            desc: "Wie verändert sich dein Gehirn, wenn Schlaf nicht mehr das Bewusstsein ausschaltet und Langeweile unerträglich wird?"
        },
        {
            id: 7,
            icon: "🎶",
            cat: "Gesellschaft & Technik",
            title: "8 Milliarden hören denselben Song",
            hook: "„Alle Menschen zur exakt gleichen Millisekunde vereint.“",
            desc: "Kollabieren die weltweiten Strom- und Streamingnetze? Was passiert in Zeitzonen, in denen gerade tiefste Nacht herrscht?"
        }
    ];

    // Local storage key for persistent 1-vote-only rule
    const STORAGE_KEY_VOTE = "was_waere_wenn_user_vote";
    const STORAGE_KEY_COUNTS = "was_waere_wenn_vote_counts";

    // Initialize counts: all starting strictly at 0
    let votes = Array(topics.length).fill(0);
    let selectedIndex = null;

    // Load from localStorage if present
    const savedVote = localStorage.getItem(STORAGE_KEY_VOTE);
    if (savedVote !== null) {
        selectedIndex = parseInt(savedVote, 10);
    }
    const savedCounts = localStorage.getItem(STORAGE_KEY_COUNTS);
    if (savedCounts) {
        try {
            votes = JSON.parse(savedCounts);
        } catch (e) {
            votes = Array(topics.length).fill(0);
        }
    }

    const grid = document.getElementById("cardsGrid");
    const resultsContainer = document.getElementById("resultsContainer");
    const totalVotesEl = document.getElementById("totalVotes");
    const resetBtn = document.getElementById("resetBtn");

    // Build the 8 cards
    const cardElements = topics.map((t, index) => {
        const card = document.createElement("div");
        card.className = "voting-card";
        card.innerHTML = `
            <div>
                <div class="card-top">
                    <div class="icon-box">${t.icon}</div>
                    <span class="badge">${t.cat}</span>
                </div>
                <div class="card-title">${t.title}</div>
                <div class="card-hook">${t.hook}</div>
                <div class="card-desc">${t.desc}</div>
            </div>
            <div class="card-bottom">
                <span class="action-label" id="label-${index}">Klicken zum Abstimmen</span>
                <span class="count-pill" id="pill-${index}">0 Stimmen</span>
            </div>
        `;
        card.addEventListener("click", () => handleCardClick(index));
        grid.appendChild(card);

        return {
            card,
            label: card.querySelector(`#label-${index}`),
            pill: card.querySelector(`#pill-${index}`)
        };
    });

    function handleCardClick(index) {
        if (selectedIndex !== null) return; // Only 1 vote allowed

        selectedIndex = index;
        votes[index] = (votes[index] || 0) + 1;

        localStorage.setItem(STORAGE_KEY_VOTE, index.toString());
        localStorage.setItem(STORAGE_KEY_COUNTS, JSON.stringify(votes));

        render();
    }

    function render() {
        const total = votes.reduce((a, b) => a + b, 0);
        totalVotesEl.textContent = total;

        topics.forEach((t, i) => {
            const count = votes[i];
            const meta = cardElements[i];

            meta.pill.textContent = `${count} Stimme${count === 1 ? '' : 'n'}`;

            if (selectedIndex !== null) {
                meta.card.classList.add("locked");
                if (selectedIndex === i) {
                    meta.card.classList.add("selected");
                    meta.label.textContent = "✓ Deine Stimme";
                } else {
                    meta.card.classList.remove("selected");
                    meta.label.textContent = "Gesperrt";
                }
            } else {
                meta.card.classList.remove("locked", "selected");
                meta.label.textContent = "Klicken zum Abstimmen";
            }
        });

        // Render sorted bottom standings
        const sortedIndices = topics.map((_, i) => i).sort((a, b) => votes[b] - votes[a]);
        resultsContainer.innerHTML = "";

        sortedIndices.forEach(idx => {
            const count = votes[idx];
            const pct = total === 0 ? 0 : Math.round((count / total) * 100);
            const topic = topics[idx];

            const item = document.createElement("div");
            item.className = "result-item";
            item.innerHTML = `
                <div class="result-meta">
                    <span class="result-label">${topic.icon} ${topic.title}</span>
                    <span class="result-stats">${count} Stimmen (${pct}%)</span>
                </div>
                <div class="progress-track">
                    <div class="progress-bar" style="width: ${pct}%;"></div>
                </div>
            `;
            resultsContainer.appendChild(item);
        });
    }

    resetBtn.addEventListener("click", () => {
        votes = Array(topics.length).fill(0);
        selectedIndex = null;
        localStorage.removeItem(STORAGE_KEY_VOTE);
        localStorage.removeItem(STORAGE_KEY_COUNTS);
        render();
    });

    render();
</script>

</body>
</html>
