<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Themen-Voting: Was wäre wenn?</title>
    <!-- Firebase Realtime Database SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #060911;
            color: #ffffff;
            padding: 3rem 1.5rem;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 980px;
            width: 100%;
        }

        .header-section {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .header-section h1 {
            font-size: 1.85rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
        }

        .header-section p {
            color: #5497ff;
            font-size: 0.95rem;
            font-weight: 500;
            max-width: 680px;
            margin: 0 auto;
            line-height: 1.45;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.25rem;
            margin-bottom: 2rem;
        }

        @media (max-width: 820px) {
            .cards-grid {
                grid-template-columns: 1fr;
            }
        }

        .voting-card {
            background-color: #0d1424;
            border: 1px solid #1a273f;
            border-radius: 16px;
            padding: 1.35rem 1.4rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 240px;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .voting-card:hover:not(.locked) {
            border-color: #3b82f6;
            background-color: #10192e;
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
        }

        .voting-card.selected {
            border-color: #3b82f6;
            background-color: #121e38;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.6);
        }

        .voting-card.locked:not(.selected) {
            opacity: 0.45;
            cursor: not-allowed;
            filter: grayscale(15%);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .icon-box {
            width: 46px;
            height: 46px;
            background-color: #141f33;
            border: 1px solid #1c2c48;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.45rem;
        }

        .badge {
            background-color: #131d31;
            color: #94a3b8;
            border: 1px solid #1e2e4d;
            font-size: 0.76rem;
            font-weight: 600;
            padding: 0.35rem 0.85rem;
            border-radius: 9999px;
            letter-spacing: 0.02em;
        }

        .card-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: #f8fafc;
            margin-bottom: 0.35rem;
            line-height: 1.3;
        }

        .card-hook {
            color: #5497ff;
            font-size: 0.86rem;
            font-weight: 500;
            margin-bottom: 0.65rem;
            line-height: 1.4;
        }

        .card-desc {
            color: #8b9bb4;
            font-size: 0.86rem;
            line-height: 1.45;
            margin-bottom: 1.25rem;
        }

        .card-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 0.85rem;
            border-top: 1px solid #162238;
        }

        .action-label {
            color: #5c6f8c;
            font-size: 0.82rem;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .voting-card:hover:not(.locked) .action-label {
            color: #93c5fd;
        }

        .voting-card.selected .action-label {
            color: #38bdf8;
            font-weight: 700;
        }

        .count-pill {
            background-color: #101a2c;
            border: 1px solid #1d2c47;
            color: #e2e8f0;
            font-size: 0.82rem;
            font-weight: 600;
            padding: 0.3rem 0.75rem;
            border-radius: 8px;
        }

        /* Summary Standings Box */
        .summary-card {
            background-color: #0d1424;
            border: 1px solid #1a273f;
            border-radius: 16px;
            padding: 1.5rem 1.6rem;
        }

        .summary-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.4rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .summary-title-group h2 {
            font-size: 1.25rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 0.25rem;
        }

        .summary-title-group p {
            font-size: 0.88rem;
            color: #64748b;
        }

        .summary-title-group p span {
            color: #5497ff;
            font-weight: 700;
        }

        .summary-btns {
            display: flex;
            gap: 0.6rem;
        }

        .btn {
            background-color: #131d31;
            color: #94a3b8;
            border: 1px solid #1f2e4d;
            padding: 0.45rem 0.95rem;
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background-color: #1a2742;
            color: #ffffff;
            border-color: #2b3d63;
        }

        .results-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .result-item {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .result-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.88rem;
        }

        .result-label {
            display: flex;
            align-items: center;
            gap: 0.55rem;
            color: #e2e8f0;
            font-weight: 500;
        }

        .result-label.my-pick {
            color: #38bdf8;
            font-weight: 700;
        }

        .result-stats {
            color: #8b9bb4;
            font-size: 0.86rem;
        }

        .progress-track {
            background-color: #080c16;
            height: 7px;
            border-radius: 9999px;
            overflow: hidden;
        }

        .progress-bar {
            background: linear-gradient(90deg, #2563eb, #3b82f6);
            height: 100%;
            width: 0%;
            border-radius: 9999px;
            transition: width 0.35s ease-out;
        }

        .live-status {
            text-align: center;
            font-size: 0.8rem;
            color: #3b82f6;
            margin-top: 1.25rem;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-section">
        <h1>Was wäre, wenn...?</h1>
        <p>Ich plane demnächst Social-Media-Kurzvideos über die wildesten „Was wäre wenn“-Gedankenexperimente. Welches Thema willst du als Erstes sehen? Stimm einfach kurz ab! 🎬👇</p>
    </div>

    <div class="cards-grid" id="cardsGrid"></div>

    <div class="summary-card">
        <div class="summary-header">
            <div class="summary-title-group">
                <h2>Aktueller Zwischenstand</h2>
                <p>Insgesamt abgegebene Stimmen: <span id="totalVotes">0</span></p>
            </div>
            <div class="summary-btns">
                <button type="button" class="btn" onclick="window.print()">🖨️ Drucken / PDF</button>
                <button type="button" class="btn" id="adminResetBtn" style="display: none; border-color: #ef4444; color: #f87171;">⚠️ Reset (Admin)</button>
            </div>
        </div>
        <div class="results-container" id="resultsContainer"></div>
        <div class="live-status" id="liveStatus">● Live mit Firebase verbunden</div>
    </div>
</div>

<script>
    const FIREBASE_DB_URL = "https://was-wenn-86cb1-default-rtdb.europe-west1.firebasedatabase.app";

    // Initialize Firebase Realtime Database
    firebase.initializeApp({
        databaseURL: FIREBASE_DB_URL
    });
    const db = firebase.database();
    const votesRef = db.ref("votes");

    const STORAGE_KEY_VOTED = "was_waere_wenn_voted_topic_v2";

    const topics = [
        {
            key: "t1_fahrstuhl",
            icon: "🛗",
            cat: "Kosmos & Physik",
            title: "Fahrstuhl ins All",
            hook: "„Bei normaler Geschwindigkeit dauert die Fahrt tagelang.“",
            desc: "Was isst du unterwegs, wann wird der Himmel pechschwarz und ab welcher Höhe schwebst du schwerelos in der Kabine?"
        },
        {
            key: "t2_ameisen",
            icon: "🐜",
            cat: "Biologie & Natur",
            title: "Alle Ameisen auf einer Waage",
            hook: "„Ameisen wiegen zusammen fast so viel wie die gesamte Menschheit.“",
            desc: "Wie sähe der astronomische Berg aus Biomasse aus und was bedeutet dieser Vergleich für das irdische Ökosystem?"
        },
        {
            key: "t3_licht",
            icon: "⚡",
            cat: "Physik & Relativität",
            title: "Lichtgeschwindigkeit bei 100 km/h",
            hook: "„Du siehst die Welt mit extremer Zeitverzögerung.“",
            desc: "Das Sonnenlicht bräuchte Stunden zu uns, Anrufe wären unmöglich und ein Spaziergang würde zur visuellen Zeitreise."
        },
        {
            key: "t4_mond",
            icon: "🌕",
            cat: "Astronomie & Schwerkraft",
            title: "Der Mond 100 km über deiner Stadt",
            hook: "„Er füllt das gesamte Sichtfeld aus und ist zum Greifen nah.“",
            desc: "Gigantische Gezeitenkräften, Gravitationschaos und die Frage: Könnte man ihn mit einer Rakete sofort berühren?"
        },
        {
            key: "t5_photosynthese",
            icon: "🌱",
            cat: "Mensch & Biochemie",
            title: "Menschen mit Photosynthese",
            hook: "„Nie wieder kochen – einfach in die Sonne legen?“",
            desc: "Wie viel Quadratmeter Hautoberfläche müsstest du freilegen, um deinen täglichen Kalorienbedarf wirklich zu decken?"
        },
        {
            key: "t6_cola",
            icon: "🥤",
            cat: "Klima & Experiment",
            title: "Die Ozeane bestehen aus Cola",
            hook: "„Klingt harmlos und süß, ist aber eine globale Katastrophe.“",
            desc: "Zuckergehalt, Säureätzung, CO2-Entgasung und gigantische Schlammstrände zerstören Küsten und das Erdklima."
        },
        {
            key: "t7_sekunde",
            icon: "🧠",
            cat: "Gehirn & Psychologie",
            title: "Jede Sekunde bewusst erleben",
            hook: "„Kein Autopilot, kein 'Zeit verfliegen lassen' mehr.“",
            desc: "Wie verändert sich dein Gehirn, wenn Schlaf nicht mehr das Bewusstsein ausschaltet und Langeweile unerträglich wird?"
        },
        {
            key: "t8_song",
            icon: "🎶",
            cat: "Gesellschaft & Technik",
            title: "8 Milliarden hören denselben Song",
            hook: "„Alle Menschen zur exakt gleichen Millisekunde vereint.“",
            desc: "Kollabieren die weltweiten Strom- und Streamingnetze? Was passiert in Zeitzonen, in denen gerade tiefste Nacht herrscht?"
        }
    ];

    let counts = {};
    topics.forEach(t => counts[t.key] = 0);

    let myVotedKey = localStorage.getItem(STORAGE_KEY_VOTED) || null;

    const grid = document.getElementById("cardsGrid");
    const resultsContainer = document.getElementById("resultsContainer");
    const totalVotesEl = document.getElementById("totalVotes");
    const liveStatus = document.getElementById("liveStatus");
    const adminResetBtn = document.getElementById("adminResetBtn");

    if (new URLSearchParams(window.location.search).get("admin") === "1") {
        adminResetBtn.style.display = "inline-flex";
    }

    // Build the 8 cards
    const cardElements = {};
    topics.forEach(t => {
        const card = document.createElement("div");
        card.className = "voting-card";
        card.id = "card-" + t.key;
        card.innerHTML = `
            <div>
                <div class="card-top">
                    <div class="icon-box">${t.icon}</div>
                    <span class="badge">${t.cat}</span>
                </div>
                <div class="card-title">${t.title}</div>
                <div class="card-hook">${t.hook}</div>
                <div class="card-desc">${t.desc}</div>
            </div>
            <div class="card-bottom">
                <span class="action-label" id="label-${t.key}">Klicken zum Abstimmen</span>
                <span class="count-pill" id="pill-${t.key}">0 Stimmen</span>
            </div>
        `;
        card.addEventListener("click", () => handleVote(t.key));
        grid.appendChild(card);

        cardElements[t.key] = {
            card,
            label: card.querySelector(`#label-${t.key}`),
            pill: card.querySelector(`#pill-${t.key}`)
        };
    });

    // Listen to Realtime updates from Firebase
    votesRef.on("value", snapshot => {
        const data = snapshot.val() || {};
        let total = 0;
        topics.forEach(t => {
            counts[t.key] = typeof data[t.key] === "number" ? data[t.key] : 0;
            total += counts[t.key];
        });
        // Wenn in Firebase alles gelöscht/0 ist, automatisch auch die Sperre auf allen Geräten aufheben:
        if (total === 0 && myVotedKey) {
            localStorage.removeItem(STORAGE_KEY_VOTED);
            myVotedKey = null;
        }
        liveStatus.textContent = "● Live synchronisiert";
        render();
    }, error => {
        console.error("Firebase error:", error);
        liveStatus.textContent = "Verbindungsfehler zur Datenbank";
    });

    function handleVote(key) {
        if (myVotedKey) return; // Prevent multiple voting per device

        myVotedKey = key;
        localStorage.setItem(STORAGE_KEY_VOTED, key);

        // Atomic transaction directly in Firebase
        const topicRef = db.ref("votes/" + key);
        topicRef.transaction(currentValue => {
            return (currentValue || 0) + 1;
        });

        render();
    }

    function render() {
        const total = Object.values(counts).reduce((a, b) => a + b, 0);
        totalVotesEl.textContent = total;

        topics.forEach(t => {
            const el = cardElements[t.key];
            const count = counts[t.key] || 0;
            el.pill.textContent = `${count} Stimme${count === 1 ? '' : 'n'}`;

            if (myVotedKey) {
                el.card.classList.add("locked");
                if (myVotedKey === t.key) {
                    el.card.classList.add("selected");
                    el.label.textContent = "✓ Deine Stimme";
                } else {
                    el.card.classList.remove("selected");
                    el.label.textContent = "Gesperrt";
                }
            } else {
                el.card.classList.remove("locked", "selected");
                el.label.textContent = "Klicken zum Abstimmen";
            }
        });

        // Standings
        const sorted = [...topics].sort((a, b) => (counts[b.key] || 0) - (counts[a.key] || 0));
        resultsContainer.innerHTML = "";

        sorted.forEach(t => {
            const count = counts[t.key] || 0;
            const pct = total === 0 ? 0 : Math.round((count / total) * 100);
            const isMyPick = myVotedKey === t.key;

            const item = document.createElement("div");
            item.className = "result-item";
            item.innerHTML = `
                <div class="result-meta">
                    <span class="result-label ${isMyPick ? 'my-pick' : ''}">
                        ${t.icon} ${t.title} ${isMyPick ? '(Deine Wahl)' : ''}
                    </span>
                    <span class="result-stats">${count} Stimmen (${pct}%)</span>
                </div>
                <div class="progress-track">
                    <div class="progress-bar" style="width: ${pct}%;"></div>
                </div>
            `;
            resultsContainer.appendChild(item);
        });
    }

    adminResetBtn.addEventListener("click", () => {
        if (confirm("Möchtest du deine Stimme im Browser zurücksetzen?")) {
            localStorage.removeItem(STORAGE_KEY_VOTED);
            myVotedKey = null;
            render();
        }
    });

    render();
</script>

</body>
</html>
